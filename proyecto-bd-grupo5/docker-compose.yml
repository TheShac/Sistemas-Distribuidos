services:
# --- BASE DE DATOS 1: GESTIÓN DE PEDIDOS ---
  bd-pedidos:
    image: postgres:15-alpine
    container_name: g5-bd-pedidos
    environment:
      POSTGRES_DB: pedidos_db
      POSTGRES_USER: user_pedidos
      POSTGRES_PASSWORD: password_pedidos
    volumes:
      - vol_pedidos_data:/var/lib/postgresql/data
      - ./init-pedidos.sql:/docker-entrypoint-initdb.d/init-pedidos.sql # <--- NUEVO
    ports:
      - "5431:5432"
    networks:
      - red-insumos-medicos

  # --- BASE DE DATOS 2: INVENTARIO DE BODEGA ---
  bd-inventario:
    image: postgres:15-alpine
    container_name: g5-bd-inventario
    environment:
      POSTGRES_DB: inventario_db
      POSTGRES_USER: user_inventario
      POSTGRES_PASSWORD: password_inventario
    volumes:
      - vol_inventario_data:/var/lib/postgresql/data
      - ./init-inventario.sql:/docker-entrypoint-initdb.d/init-inventario.sql # <--- NUEVO
    ports:
      - "5432:5432"
    networks:
      - red-insumos-medicos

  # --- BASE DE DATOS 3: CONTABILIDAD MÉDICA ---
  bd-contabilidad:
    image: postgres:15-alpine
    container_name: g5-bd-contabilidad
    environment:
      POSTGRES_DB: contabilidad_db
      POSTGRES_USER: user_contabilidad
      POSTGRES_PASSWORD: password_contabilidad
    volumes:
      - vol_contabilidad_data:/var/lib/postgresql/data
      - ./init-contabilidad.sql:/docker-entrypoint-initdb.d/init-contabilidad.sql # <--- NUEVO
    ports:
      - "5433:5432"
    networks:
      - red-insumos-medicos
# --- RESPALDOS AUTOMÁTICOS CADA 10 MINUTOS ---
  respaldos-automaticos:
    image: prodrigestivill/postgres-backup-local:15-alpine
    container_name: g5-respaldos
    restart: always
    volumes:
      - ./backups:/backups # <--- Los respaldos se guardarán en una carpeta llamada "backups" en tu PC
    environment:
      - POSTGRES_HOST=bd-pedidos,bd-inventario,bd-contabilidad # <--- Las 3 BD que debe mirar
      - POSTGRES_USER=user_pedidos,user_inventario,user_contabilidad
      - POSTGRES_PASSWORD=password_pedidos,password_inventario,password_contabilidad
      - POSTGRES_DB=pedidos_db,inventario_db,contabilidad_db
      - SCHEDULE=@every 10m # <--- ¡LA MAGIA! Ejecuta el respaldo exactamente cada 10 minutos
      - BACKUP_KEEP_MINS=60 # Borra los respaldos viejos para no colapsar tu disco duro
    networks:
      - red-insumos-medicos
  # --- HERRAMIENTA VISUAL: PGADMIN 4 ---
  pgadmin:
    image: dpage/pgadmin4
    container_name: g5-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@grupo5.cl   # Correo para iniciar sesión en la web
      PGADMIN_DEFAULT_PASSWORD: adminpassword  # Contraseña para iniciar sesión en la web
    ports:
      - "8080:80" # Entrarás en tu navegador usando http://localhost:8080
    networks:
      - red-insumos-medicos
    depends_on:
      - bd-pedidos
      - bd-inventario
      - bd-contabilidad

# --- DECLARACIÓN DE VOLÚMENES (PERSISTENCIA) ---
volumes:
  vol_pedidos_data:
  vol_inventario_data:
  vol_contabilidad_data:

# --- RED INTERNA ---
networks:
  red-insumos-medicos:
    driver: bridge